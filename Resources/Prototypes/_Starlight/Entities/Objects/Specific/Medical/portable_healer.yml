- type: entity
  name: portable healer
  parent: BaseMachine
  id: PortableHealer
  description: A medical pulse emitter with a proximity trigger. Soothes the wounds of anyone who lingers nearby.
  components:
    - type: EmitSoundOnTrigger
      predicted: true
      sound:
        path: /Audio/Items/Medical/healthscanner.ogg
    - type: HealAreaOnTrigger
      ignoreResistances: true
      range: 2
      damage:
        types:
          Blunt: -5
          Slash: -5
          Piercing: -5
          Heat: -5
          Shock: -5
          Cold: -5
          Caustic: -5
          Asphyxiation: -5
          Bloodloss: -5
          Poison: -5
          Radiation: -5
          Cellular: -5
    - type: TriggerOnProximity
      enabled: true
      cooldown: 5
      triggerSpeed: 0
      shape:
        !type:PhysShapeCircle
          radius: 2
      repeating: true
    - type: Sprite
      sprite: Objects/Specific/Medical/portable_healer.rsi
      layers:
        - state: "off"
          map: ["enum.ProximityTriggerVisualLayers.Base"]
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.15,-0.3,0.15,0.3"
          mask:
          - MachineMask
          layer:
          - MachineLayer
          density: 380
    - type: Appearance
    - type: AnimationPlayer
    - type: PointLight
      color: "#7CFC9C"
      energy: 1.5
      radius: 1.5
      softness: 1
      enabled: true
    - type: GuideHelp
      guides:
      - Medical
