- type: entity
  id: PaperSalvageBountyManifest
  parent: PaperCargoInvoice
  name: salvage bounty manifest
  description: A paper label designating a crate as containing a salvage bounty. Selling a crate with this label at the salvage sale console pays the bounty reward in tickets.
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#e89a47"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#e89a47"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperLabelType
    paperType: Bounty
  - type: Tag
    tags:
    - Document
    - Trash
    - Paper
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    contentImagePath: "/Textures/Interface/Paper/paper_content_lined.svg.96dpi.png"
    backgroundModulate: "#e89a47"
    contentImageModulate: "#e89a47"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 16.0, 16.0, 16.0, 16.0
    headerImagePath: "/Textures/Interface/Paper/paper_heading_cargo_invoice.svg.96dpi.png"
    headerMargin: 0.0, 12.0, 0.0, 0.0
  - type: SalvageBountyLabel
  - type: StaticPrice
    price: 0
