- type: entity
  id: ComputerSalvageSaleConsole
  parent: BaseComputerAiAccess
  name: salvage sale computer
  description: Used to sell goods loaded onto cargo pallets in exchange for salvage tickets.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: transfer
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Anchorable
    flags:
    - Anchorable
  - type: SalvageSaleConsole
    spesosPerTicket: 100
  # Items obtainable from the salvage ticket vendor or the solo salvage vending machine.
  # Listed here so players can't recycle them back into tickets.
  - type: SalvageSaleBlacklist
    blacklist:
    - AdvancedMineralScanner
    - Binoculars
    - BoxFlare
    - BoxLethalshot
    - BoxMRE
    - BrainImplantCommsExpedition
    - ClothingBeltSalvageMercWebbing
    - ClothingEyesGlassesSalvageMercenary
    - ClothingHandsSalvageMercGlovesCombat
    - ClothingHeadHatBeretSalvageMercBrown
    - ClothingHeadHatBeretSalvageMercGreen
    - ClothingHeadHatBeretSalvageMercPurple
    - ClothingHeadHelmetFire
    - ClothingHeadHelmetSalvageMerc
    - ClothingMaskGasExplorer
    - ClothingOuterHardsuitLuxury
    - ClothingOuterHardsuitMaxim
    - ClothingOuterHardsuitSalvage
    - ClothingOuterHardsuitSpatio
    - ClothingOuterVestWebSalvageMerc
    - ClothingShoesBootsSalvageMerc
    - ClothingUniformJumpsuitSalvageMercBrown
    - ClothingUniformJumpsuitSalvageMercGreen
    - ClothingUniformJumpsuitSalvageMercWhite
    - Crowbar
    - Flare
    - FlashlightLanternBright
    - Floodlight
    - HandheldHealthAnalyzer
    - HandHeldMassScanner
    - HandheldStationMap
    - LeftArmCyberSpacer
    - MagazineBatteryLr30
    - MagazinePistolSP
    - MaterialSiloMachineCircuitboard
    - MechClarke
    - MedkitAdvancedFilled
    - MedkitCombatFilled
    - MedkitFilled
    - MineralScanner
    - MiningDrill
    - MiningDrillDiamond
    - OreBag
    - OreBagOfHolding
    - OreProcessorIndustrialMachineCircuitboard
    - Pickaxe
    - PKAUpgradeDamage
    - PKAUpgradeFireRate
    - PKAUpgradeRange
    - PlushieCarp
    - RightArmCyberSpacer
    - SpeedLoaderMagnumSP
    - SpeedLoaderShotgunEmpty
    - WeaponGrapplingGun
    - WeaponLaserImmolator
    - WeaponLr30
    - WeaponMechMelleDrill
    - WeaponMechMelleDrillDiamond
    - WeaponPistolMk58
    - WeaponProtoKineticAccelerator
    - WeaponRevolverZOZ
    - WeaponShotgunCycler
    - WeaponShotgunGA12
  - type: ActivatableUI
    key: enum.SalvageSaleConsoleUiKey.Sale
  - type: UserInterface
    interfaces:
      enum.SalvageSaleConsoleUiKey.Sale:
        type: SalvageSaleConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: SalvageSaleComputerCircuitboard
  - type: PointLight
    radius: 2.5
    energy: 1.5
    color: "#b89f25"
  - type: GuideHelp
    guides:
    - Cargo
